<style>
/* Layout: one-column phone app; sticky green header, big touch targets, cards only for separable objects */
:root {
  --leaf: #3f8f3a; --leaf-ink: #ffffff; --forest: #1f4d2b; --earth: #7a4e2d; --earth-soft: #a9774b;
  --bg: #fbf6e9; --card: #fffdf6; --ink: #2a2a22; --muted: #6a6656; --line: #e4dcc4; --yellow: #f6e7a6;
  --warn-bg: #fff4d6; --warn-ink: #6e4b00; --warn-line: #f0d48a;
  --err-bg: #fde8e4; --err-ink: #8a1f11; --err-line: #f2b8ad;
  --ok-bg: #e8f3e4; --ok-ink: #1f4d2b; --ok-line: #bcdcb2;
  --sev-high: #c0392b; --sev-mid: #d39b17;
  --sky-top: #f9e7b0; --sky-bottom: #fdf5dc; --sun: #f2b84b; --hill: #9fbf7a; --tree: #2f5d2a;
  --wall: #e9d3ae; --roof: #8a4b28; --door: #5c3a22; --field-1: #7fb24f; --field-2: #5e9a3a; --field-3: #3f7d2b; --row: #d8e8a8;
  --hero-ink: #1f3b17; --hero-sub: #3b3a2a;
  --header: #1f4d2b; --header-ink: #ffffff;
  --font: 'Mukta', 'Noto Sans Tamil', system-ui, sans-serif;
  --font-ta: 'Noto Sans Tamil', 'Mukta', system-ui, sans-serif;
  --r: 16px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --leaf: #6dbb5f; --leaf-ink: #0e1a0b; --forest: #b7e3a8; --earth: #d4a274; --earth-soft: #b68757;
  --bg: #141a12; --card: #1d251a; --ink: #ecebdf; --muted: #a8a690; --line: #33402c; --yellow: #4a421c;
  --warn-bg: #3a2f10; --warn-ink: #f6d98a; --warn-line: #6b5520; --err-bg: #3d1a14; --err-ink: #f7b6a9; --err-line: #6e2d22;
  --ok-bg: #1c3320; --ok-ink: #c5e8bb; --ok-line: #2f5434; --sev-high: #ef7b6c; --sev-mid: #e8c15a;
  --sky-top: #24304a; --sky-bottom: #3a3f45; --sun: #e9d9a0; --hill: #3e5a33; --tree: #1a2c17;
  --wall: #8f7c5e; --roof: #5d3420; --door: #2d1d12; --field-1: #3f6a2a; --field-2: #335a22; --field-3: #284a1a; --row: #6c8a4c;
  --hero-ink: #f3ecd2; --hero-sub: #e2dcc4; --header: #0f1a0d; --header-ink: #ecebdf; color-scheme: dark } }
:root[data-theme="dark"] {
  --leaf: #6dbb5f; --leaf-ink: #0e1a0b; --forest: #b7e3a8; --earth: #d4a274; --earth-soft: #b68757;
  --bg: #141a12; --card: #1d251a; --ink: #ecebdf; --muted: #a8a690; --line: #33402c; --yellow: #4a421c;
  --warn-bg: #3a2f10; --warn-ink: #f6d98a; --warn-line: #6b5520; --err-bg: #3d1a14; --err-ink: #f7b6a9; --err-line: #6e2d22;
  --ok-bg: #1c3320; --ok-ink: #c5e8bb; --ok-line: #2f5434; --sev-high: #ef7b6c; --sev-mid: #e8c15a;
  --sky-top: #24304a; --sky-bottom: #3a3f45; --sun: #e9d9a0; --hill: #3e5a33; --tree: #1a2c17;
  --wall: #8f7c5e; --roof: #5d3420; --door: #2d1d12; --field-1: #3f6a2a; --field-2: #335a22; --field-3: #284a1a; --row: #6c8a4c;
  --hero-ink: #f3ecd2; --hero-sub: #e2dcc4; --header: #0f1a0d; --header-ink: #ecebdf; color-scheme: dark }

* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.5 var(--font); -webkit-text-size-adjust: 100%; }
html:lang(ta) body { font-family: var(--font-ta); }
h1, h2, h3 { color: var(--forest); line-height: 1.2; margin: 0 0 .4em; text-wrap: balance; }
h1 { font-size: 1.55rem; } h2 { font-size: 1.3rem; } h3 { font-size: 1.08rem; }
p { margin: 0 0 .6em; } a { color: var(--leaf); }
.muted { color: var(--muted); } .small { font-size: .88rem; }
button, input { font: inherit; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--header); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--header); color: var(--header-ink);
  display: flex; align-items: center; gap: 10px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; font-weight: 700; font-size: 1.08rem; flex: 1; min-width: 0; }
.brand svg { flex: none; }
.lang { display: inline-flex; border: 2px solid color-mix(in srgb, var(--header-ink) 35%, transparent); border-radius: 999px; overflow: hidden; flex: none; }
.lang button { border: 0; background: transparent; color: var(--header-ink); padding: 6px 12px; font-weight: 700; cursor: pointer; min-height: 40px; }
.lang button[aria-pressed="true"] { background: var(--header-ink); color: var(--header); }

main { max-width: 640px; margin: 0 auto; padding-block: 16px 104px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 14px; }
.view { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 52px; padding: 10px 18px;
  border-radius: 12px; border: 2px solid transparent; font-weight: 700; cursor: pointer; text-decoration: none; text-align: center; }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.primary { background: var(--leaf); color: var(--leaf-ink); }
.secondary { background: transparent; color: var(--earth); border-color: var(--earth-soft); }
.ghost { background: transparent; color: var(--muted); border-color: var(--line); min-height: 42px; }
.block { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; } .row > .btn { flex: 1 1 160px; }

.hero { position: relative; border-radius: var(--r); overflow: hidden; min-height: 200px; }
.hero svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.hero-text { position: relative; padding: 18px; }
.hero-text h1 { color: var(--hero-ink); font-size: 1.8rem; margin: 0 0 4px; }
.hero-text p { color: var(--hero-sub); font-weight: 600; max-width: 30ch; }

.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { display: flex; flex-direction: column; gap: 2px; padding: 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line);
  color: var(--ink); text-decoration: none; min-height: 112px; cursor: pointer; text-align: left; }
.tile b { color: var(--forest); font-size: 1.04rem; }
.tile span { color: var(--muted); font-size: .86rem; }
.tile.main { grid-column: 1 / -1; background: var(--leaf); border-color: var(--leaf); min-height: 96px; }
.tile.main b, .tile.main span { color: var(--leaf-ink); } .tile.main b { font-size: 1.25rem; }
.tile .ico { width: 30px; height: 30px; margin-bottom: 6px; }
.tile.main .ico { color: var(--leaf-ink); } .tile .ico { color: var(--leaf); }

.note { background: color-mix(in srgb, var(--yellow) 70%, transparent); border-radius: 12px; padding: 10px 14px; font-size: .94rem; }
.alert { border: 1px solid; border-radius: 12px; padding: 12px 14px; font-size: .95rem; }
.alert b { display: block; }
.a-warn { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-line); }
.a-err { background: var(--err-bg); color: var(--err-ink); border-color: var(--err-line); }
.a-ok { background: var(--ok-bg); color: var(--ok-ink); border-color: var(--ok-line); }

.drop { border: 3px dashed var(--line); border-radius: var(--r); padding: 22px 16px; text-align: center; color: var(--muted); }
.preview { display: block; width: 100%; max-height: 340px; object-fit: contain; border-radius: 12px; background: var(--bg); }
.progress { display: flex; align-items: center; gap: 12px; font-weight: 600; color: var(--forest); padding: 8px 0; }
.spin { width: 28px; height: 28px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--leaf); animation: s .9s linear infinite; flex: none; }
@keyframes s { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

.res-top { display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: start; }
.res-top img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 12px; }
.pill { display: inline-block; font-weight: 700; font-size: .86rem; padding: 3px 12px; border-radius: 999px; margin-bottom: 6px; }
.p-ok { background: var(--ok-bg); color: var(--ok-ink); } .p-warn { background: var(--warn-bg); color: var(--warn-ink); }
.dname { font-size: 1.45rem; margin: 2px 0; }
.conf { display: flex; align-items: center; gap: 10px; }
.track { flex: 1; height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
.fill { height: 100%; border-radius: 999px; background: var(--leaf); }
.fill.mid { background: var(--sev-mid); } .fill.low { background: var(--sev-high); }
.conf b { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; }
.sev { border-left: 6px solid var(--line); background: var(--bg); border-radius: 12px; padding: 12px 14px; }
.sev.high { border-left-color: var(--sev-high); } .sev.moderate { border-left-color: var(--sev-mid); }
.sec h3 { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sec ul { margin: 0; padding-left: 1.2em; } .sec li { margin-bottom: 6px; }
.speak { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px; padding: 4px 12px; font-size: .86rem; font-weight: 600; cursor: pointer; min-height: 34px; }
.cands { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
.src li { word-break: break-word; }

.hist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.hist li { display: flex; align-items: center; gap: 12px; }
.hist .open { display: flex; gap: 12px; align-items: center; flex: 1; min-width: 0; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); cursor: pointer; }
.hist img { width: 60px; height: 60px; border-radius: 10px; object-fit: cover; flex: none; background: var(--line); }

label.fld { display: flex; flex-direction: column; gap: 4px; font-weight: 600; }
input[type=text] { min-height: 52px; border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; background: var(--bg); color: var(--ink); width: 100%; }
.tips { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.tips li { display: flex; gap: 12px; align-items: flex-start; }
.tips .n { flex: none; width: 32px; height: 32px; border-radius: 50%; background: var(--leaf); color: var(--leaf-ink); display: grid; place-items: center; font-weight: 700; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stats div { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
.stats b { display: block; font-size: 1.35rem; color: var(--forest); font-variant-numeric: tabular-nums; }

.nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: grid; grid-template-columns: repeat(5, 1fr);
  background: var(--card); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.nav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 60px; color: var(--muted); text-decoration: none; font-size: .74rem; font-weight: 600; text-align: center; padding: 4px 2px; }
.nav a svg { width: 24px; height: 24px; }
.nav a[aria-current="page"] { color: var(--leaf); }
</style>

function f16(h) {
  const s = (h & 0x8000) ? -1 : 1, e = (h >> 10) & 0x1f, f = h & 0x3ff;

  return s * Math.pow(2, e - 15) * (1 + f / 1024);
}

/* ---------------- image checks (same thresholds as the server) ---------------- */
function qualityCheck(img) {
  const w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  if (Math.min(w, h) < 96) return "too_small";
  const sc = Math.min(1, 512 / Math.max(w, h)), cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
  const c = el("canvas", { width: cw, height: ch }), g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(img, 0, 0, cw, ch);
  const d = g.getImageData(0, 0, cw, ch).data, grey = new Float32Array(cw * ch);
  let sum = 0;
  for (let i = 0, j = 0; i < d.length; i += 4, j++) { const v = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]; grey[j] = v; sum += v; }
  const mean = sum / grey.length;
  if (mean < 25) return "too_dark";
  if (mean > 240) return "too_bright";
  let n = 0, s1 = 0, s2 = 0;
  for (let y = 1; y < ch - 1; y++) for (let x = 1; x < cw - 1; x++) {
    const i = y * cw + x, L = grey[i - cw] + grey[i + cw] + grey[i - 1] + grey[i + 1] - 4 * grey[i];
    s1 += L; s2 += L * L; n++;
  }
  const varL = n ? s2 / n - (s1 / n) ** 2 : 0;
  if (varL < 15) return "too_blurry";
  return null;
}

/* ---------------- prediction (same decision rule as the server) ---------------- */
async function predict(img) {
  const c = el("canvas", { width: 224, height: 224 }), g = c.getContext("2d");
  g.imageSmoothingQuality = "high"; g.drawImage(img, 0, 0, 224, 224);
  const outs = tf.tidy(() => {
    const x = tf.browser.fromPixels(c).toFloat().expandDims(0);
    let o = MODEL.execute(x);
    if (!Array.isArray(o)) o = [o.output_0 ?? o["Identity:0"], o.output_1 ?? o["Identity_1:0"]];
    return o.map((z) => z.dataSync().slice());
  });
  let emb = outs[0], probs = outs[1];
  if (emb.length !== META.emb_dim) { [emb, probs] = [probs, emb]; }
  const D = META.emb_dim, K = META.n_means, diff = new Float64Array(D);
  let best = Infinity;
  for (let k = 0; k < K; k++) {
    for (let i = 0; i < D; i++) diff[i] = emb[i] - MEANS[k * D + i];
    let d2 = 0;
    for (let i = 0; i < D; i++) { let row = 0; const off = i * D; for (let j = 0; j < D; j++) row += PREC[off + j] * diff[j]; d2 += diff[i] * row; }
    if (d2 < best) best = d2;
  }
  const dist = Math.sqrt(Math.max(best, 0));
  const order = [...probs.keys()].sort((a, b) => probs[b] - probs[a]);
  const top = META.labels[order[0]];
  const topK = order.filter((i) => META.labels[i] !== UNSUPPORTED).slice(0, 3).map((i) => ({ class_id: META.labels[i], confidence: probs[i] }));
  let status = "ok";
  if (top === UNSUPPORTED || dist > META.threshold) status = "unsupported";
  else if (topK[0].confidence < META.min_confidence) status = "uncertain";
  return { status, class_id: status === "ok" ? topK[0].class_id : null, confidence: topK[0].confidence, top_k: topK, ood_distance: dist };
}

  $("#shop-google").href = `https://www.google.com/maps/search/?api=1&query=${enc("fertilizer seeds pesticide shop near " + q)}`;
  $("#shop-osm").href = `https://www.openstreetmap.org/search?query=${enc("fertilizer shop " + q)}`;
  $("#shop-ta").href = `https://www.google.com/maps/search/?api=1&query=${enc("உரக்கடை " + q)}`;
  if (ok) store.set("cd.village", q);
}
$("#village").value = store.get("cd.village", "");
$("#village").addEventListener("input", updateShopLinks);
$("#shop-form").addEventListener("submit", (e) => { e.preventDefault(); updateShopLinks(); });

/* ---------------- tips + about ---------------- */
function renderTips() {
  const ol = $("#tips"); ol.replaceChildren();
  TIPS[lang].forEach(([txt, src], i) => ol.append(el("li", { class: "card" }, el("span", { class: "n", text: String(i + 1) }), el("div", {}, el("p", { style: "margin:0 0 2px", text: txt }), el("small", { class: "muted", text: src })))));
}
$("#tips-speak").addEventListener("click", (e) => speak(TIPS[lang].map((x) => x[0]).join(". "), e.currentTarget));
async function renderAbout() {
  const box = $("#about-body");
  try { await Promise.all([metaReady, kbReady]); } catch { return; }
  const pc = (x) => (x * 100).toFixed(1) + "%";
  const classes = META.labels.filter((l) => l !== UNSUPPORTED).map((id) => { const d = disease(id); return `${d.crop_name} — ${d.name}`; });
  box.replaceChildren(
    el("p", { text: t("aboutLead") }),
    el("div", { class: "stats" },
      el("div", {}, el("b", { text: pc(META.test_accuracy) }), el("span", { class: "small", text: t("statAcc") })),
      el("div", {}, el("b", { text: pc(META.final_rule.accuracy_when_ok) }), el("span", { class: "small", text: t("statOk") })),
      el("div", {}, el("b", { text: String(classes.length) }), el("span", { class: "small", text: t("statClasses") })),
      el("div", {}, el("b", { text: "100%" }), el("span", { class: "small", text: t("statOod") }))),
    el("p", { style: "margin-top:12px", text: t("aboutRules") }),
    el("div", { class: "alert a-warn", text: t("aboutLimits") }),
    el("details", { style: "margin-top:10px" }, el("summary", { text: `${t("classesLabel")} (${classes.length})` }), el("ul", { class: "small" }, classes.map((c) => el("li", { text: c })))),
    el("p", { class: "small muted", style: "margin-top:10px", text: "PlantVillage dataset: Mohanty, Hughes & Salathé (2016), CC BY-SA 3.0. Source code: github.com/balamurugangethub/ai-crop" }));
}

/* ---------------- start ---------------- */
for (const b of document.querySelectorAll("[data-lang]")) b.addEventListener("click", () => { lang = b.dataset.lang; store.set("cd.lang", lang); applyText(); });
kbReady.then(() => { renderHistory(); if (current === "result" && lastResult) renderResult(lastResult); }).catch(() => {});
applyText(); route();
</script>
